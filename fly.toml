# Fly.io deployment config for OG Engine
# Deploy: fly deploy
# Secrets (set via fly secrets set):
#   STRIPE_SECRET_KEY       - Stripe API secret key
#   STRIPE_WEBHOOK_SECRET   - Stripe webhook signing secret
#   STRIPE_PRICE_STARTER    - Stripe Price ID for Starter plan
#   STRIPE_PRICE_PRO        - Stripe Price ID for Pro plan
#   STRIPE_PRICE_SCALE      - Stripe Price ID for Scale plan
#   RESEND_API_KEY           - Resend transactional email API key
#   ADMIN_CRON_SECRET        - Shared secret for GitHub Action cron

app = "og-engine"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/og-engine.db"
  IMAGE_CACHE_MAX = "1000"
  RATE_LIMIT_MAX = "100"
  RATE_LIMIT_WINDOW_MS = "60000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "5s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "2s"

[mounts]
  source = "og_engine_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
