name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download fonts
        run: bun run fonts:download

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test
        env:
          AUTH_ENABLED: "false"

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t og-engine:ci .
