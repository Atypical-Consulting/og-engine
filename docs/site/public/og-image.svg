<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="100%" style="stop-color:#0c1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38ef7d"/>
      <stop offset="100%" style="stop-color:#11998e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#38ef7d" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="url(#accent)"/>

  <!-- Tag pill -->
  <rect x="80" y="80" rx="4" ry="4" width="120" height="28" fill="rgba(56,239,125,0.15)" stroke="#38ef7d" stroke-width="1"/>
  <text x="140" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38ef7d" text-anchor="middle" letter-spacing="0.05em">OPEN SOURCE</text>

  <!-- Title -->
  <text x="80" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#eef2f7" letter-spacing="-0.02em">OG Engine</text>

  <!-- Subtitle -->
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a1b5">Generate images in 2ms.</text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a1b5">No browser required.</text>

  <!-- Stats row -->
  <g transform="translate(80, 380)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#38ef7d">425x</text>
    <text y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7a90" letter-spacing="0.04em">FASTER</text>
  </g>
  <g transform="translate(260, 380)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#38ef7d">50x</text>
    <text y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7a90" letter-spacing="0.04em">LESS MEMORY</text>
  </g>
  <g transform="translate(460, 380)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#38ef7d">500+</text>
    <text y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7a90" letter-spacing="0.04em">CONCURRENT</text>
  </g>

  <!-- URL -->
  <text x="80" y="560" font-family="monospace" font-size="16" fill="#4d5a6e">og-engine.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)" opacity="0.3"/>
</svg>
